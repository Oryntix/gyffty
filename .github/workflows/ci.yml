name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gyffty
          POSTGRES_PASSWORD: gyffty
          POSTGRES_DB: gyffty_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gyffty"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Format check (ruff)
        run: ruff format --check app tests

      - name: Type check (mypy)
        run: mypy app
        continue-on-error: true

      # Twice, on purpose. SQLite is fast and catches most regressions, but
      # only PostgreSQL exercises row locking, enum storage and real
      # transaction isolation — which is what production runs on.
      - name: Tests (SQLite)
        run: pytest -q

      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://gyffty:gyffty@localhost:5432/gyffty_test
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Migrations apply to a real Postgres
        env:
          ENVIRONMENT: staging
          DATABASE_URL: postgresql+psycopg://gyffty:gyffty@localhost:5432/gyffty_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Production config guard actually refuses unsafe settings
        env:
          ENVIRONMENT: production
          DEBUG: 'false'
          SECRET_KEY: change-me-in-production
          DATABASE_URL: postgresql+psycopg://gyffty:gyffty@localhost:5432/gyffty_test
        run: |
          if python -c "from app.core.config import Settings; Settings()" 2>/dev/null; then
            echo "::error::Production guard did not reject a placeholder SECRET_KEY"
            exit 1
          fi
          echo "Guard rejected the unsafe config, as expected."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          # The build must not need a live API; pages that fetch are dynamic.
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com/api/v1
          API_BASE_URL: https://api.example.com/api/v1
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runner
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.example.com/api/v1
            NEXT_PUBLIC_SITE_URL=https://example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
